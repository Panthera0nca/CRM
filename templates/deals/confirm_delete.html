{% extends 'base.html' %}
{% block title %}Eliminar negocio — CRM{% endblock %}

{% block content %}
<div class="mb-4">
  <a href="{% url 'deals:list' %}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Negocios</a>
  <h4 class="mb-0 fw-semibold mt-1">Eliminar negocio</h4>
</div>
<div class="card p-4" style="max-width:480px;">
  <p>¿Estás seguro de que quieres eliminar <strong>{{ object.title }}</strong>? Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-danger">Sí, eliminar</button>
      <a href="{% url 'deals:list' %}" class="btn btn-outline-secondary">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
